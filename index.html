<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartJeep AI | Commuter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-shell">
        <header class="compact-header">
            <div class="brand">
                <i data-lucide="zap" class="logo-icon"></i>
                <span>SmartJeep <strong>AI</strong></span>
            </div>
            <div class="live-status">
                <span class="dot"></span> LIVE FEED
            </div>
        </header>

        <nav class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('map')">Route Map</button>
            <button class="tab-btn" onclick="switchTab('stats')">Vehicle Stats</button>
        </nav>

        <main id="main-content">
            <section id="map-view" class="view">
                <div class="map-wrapper">
                    <iframe 
                        src="https://maps.google.com/maps?q=Manila&t=&z=15&ie=UTF8&iwloc=&output=embed" 
                        width="100%" height="450" style="border:0;" allowfullscreen>
                    </iframe>
                </div>
            </section>

            <section id="stats-view" class="view hidden">
                <div class="stats-grid">
                    <div class="stat-card" title="DHT22 Sensor">
                        <i data-lucide="thermometer"></i>
                        <div class="stat-info">
                            <span id="temp-val">--</span>°C
                            <small>Cabin Temp</small>
                        </div>
                    </div>
                    <div class="stat-card" title="DHT22 Sensor">
                        <i data-lucide="droplets"></i>
                        <div class="stat-info">
                            <span id="hum-val">--</span>%
                            <small>Humidity</small>
                        </div>
                    </div>
                </div>

                <div class="ai-container" id="ai-card">
                    <div class="ai-header">
                        <i data-lucide="brain-circuit"></i>
                        <span>Agentic AI Layer</span>
                    </div>
                    <h2 id="ai-status">INITIALIZING...</h2>
                    <div class="progress-bg">
                        <div id="ai-bar" class="progress-fill"></div>
                    </div>
                    <p id="occupancy-detail">Waiting for ESP32-CAM data...</p>
                </div>

                <button class="sync-btn" onclick="triggerAIReload()">
                    <i data-lucide="refresh-cw" id="sync-icon"></i>
                    Sync with Cloud Database
                </button>
            </section>
        </main>

        <footer class="action-footer">
            <button class="primary-btn" onclick="alert('Notification set for next arrival!')">
                <i data-lucide="bell"></i> Notify Me on Arrival
            </button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
