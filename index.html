<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Jeep Live Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>E-Jeep Live Tracker</h2>

    <div class="stats-container">
        <div class="stat-item">
            <span class="stat-label">Status</span>
            <span id="status" class="stat-value">Connecting...</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Distance to Me</span>
            <span id="distance" class="stat-value">0.00 km</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">ETA</span>
            <span id="eta" class="stat-value">-- mins</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
